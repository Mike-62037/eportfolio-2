<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Michael Paige</title>
  <link rel="stylesheet" href="style.css">
  <script src="https://kit.fontawesome.com/16109a15dd.js" crossorigin="anonymous"></script>
</head>
<body>
  <section #landing-page>
    <nav>
      <figure>
        <img id="personal-logo" src="./assets/logo.svg" alt="">
      </figure>
      <ul class="nav__link--list">
        <li class="nav__links">
          <a href="#" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">About</a>
        </li>
        <li class="nav__links">
          <a href="#" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Projects</a>
        </li>
        <li class="nav__links">
          <a href="#" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          ">Contact</a>
        </li>
        <li class="nav__links click">
          <a href="#" class="
          nav__link--anchor
          link__hover-effect
          link__hover-effect--black
          "><i class="fa-solid fa-circle-half-stroke"></i></a>
        </li>
      </ul>
    </nav>
    <header class="header">
      <div class="header__content">
        <h1 class="title">Hey</h1>
        <h1 class="title blue">I'm Michael.</h1>
        <p class="header__para">I'm a <b class="blue">Frontend Software Engineer</b> with a strong passion for building web applications with great user experiences.
          <br>
          Here's a bit more <b class="blue">about me.</b>
        </p>
        <div class="social__list">
          <a href="#" class="social__link click">
            <i class="fab fa-linkedin-in"></i>
          </a>
          <a href="https://github.com/Mike-62037" target="_blank" class="social__link click">
            <i class="fab fa-github"></i>
          </a>
          <a href="#" class="social__link click">
            <i class="fas fa-file-pdf"></i>
            </a>
        </div>
      </div>
    </header>
    <button class="mail__button click">
      <i class="fas fa-envelope"></i>
    </button>
    <a href="projects" class="scroll">
      <div class="scroll__icon click"></div>
    </a>
  </section>
</body>
</html>
